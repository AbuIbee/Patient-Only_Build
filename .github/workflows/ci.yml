name: CI

# MMA-CODEX-011 011-12 (F-20, P2): independent audit finding "complete
# safe acceptance gate absent" -- neither existing workflow ran
# typecheck, lint, unit tests, or integration tests at all, and
# playwright.yml ran `npx playwright test` with no backend configured
# and no explicit target (see playwright.yml's own fix in this same
# change for the browser leg). This workflow is the real gate: it runs
# on every push and pull_request (not just push to main, so it actually
# gates merges), and the integration job provisions its OWN disposable
# Supabase stack via the already-established scripts/disposable_supabase.mjs
# (a non-"repo" project id/ports, torn down after the job) and passes
# MMA_TEST_API_BASE/MMA_TEST_DB_CONTAINER explicitly -- the same
# fail-closed target validation (tests/integration/_targetValidation.ts)
# that governs local runs rejects an unset or unsafe target here too.
on:
  push:
  pull_request:

# Neither job here ever pushes or writes to the repo -- declared
# explicitly rather than relying on the org/repo default (which can be
# read/write). This workflow's own triggers (push, pull_request) are
# not the workflow_run privilege-escalation pattern (see playwright.yml's
# security note) since GitHub already runs a fork's pull_request here
# with a read-only token and no secrets by default; minimal permissions
# is still correct defense-in-depth regardless.
permissions:
  contents: read

# Obsolete commits should not saturate the disposable-stack CI runner pool.
# Keep distinct push and PR groups so current checks still execute independently.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  static-checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm run test:unit
      - name: Build production frontend bundle
        run: npm run build

  integration:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci
      - name: Start disposable Supabase stack
        run: node scripts/disposable_supabase.mjs start
      - name: Fail fast on clinical document and tenant authorization regressions
        run: |
          eval "$(node scripts/disposable_supabase.mjs env | sed 's/^/export /')"
          export MMA_TEST_FUNCTIONS_BASE="${MMA_TEST_API_BASE}/functions/v1"
          npx vitest run --config vitest.integration.config.ts tests/integration/hcnClinicalCoordinationFoundation.test.ts -t 'SEC-006'
          # Release gate: no anon EXECUTE on ANY public schema function.
          npx vitest run --config vitest.integration.config.ts tests/integration/round7MasterCorrectiveSecurity.test.ts -t 'EXHAUSTIVE GUARD'
      - name: Run integration tests against the disposable stack (explicit target, never a default)
        run: |
          eval "$(node scripts/disposable_supabase.mjs env | sed 's/^/export /')"
          # The disposable stack already serves Edge Functions at its own
          # /functions/v1 endpoint; two HCN HTTP suites require this explicit
          # fail-closed target rather than an unconfigured URL.
          export MMA_TEST_FUNCTIONS_BASE="${MMA_TEST_API_BASE}/functions/v1"
          npm run test:integration
      - name: Upload integration test results
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: integration-test-results
          path: test-results/
          retention-days: 14
          if-no-files-found: ignore
      - name: Stop disposable Supabase stack
        if: always()
        run: node scripts/disposable_supabase.mjs stop

  clinical-playwright:
    needs: [static-checks, integration]
    # Browser acceptance must gate PRs as well as pushes; disposable synthetic data only.
    if: github.event_name == 'push' || github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci
      - name: Start local mock Resend (no real messages or keys)
        run: |
          node tests/e2e_support/mockResendServer.mjs > /tmp/hcn_mock_resend.log 2>&1 &
          echo $! > /tmp/hcn_mock_resend.pid
          npx wait-on http-get://127.0.0.1:8999/last-email?to=healthcheck
      - name: Start disposable Supabase stack for browser tests
        env:
          MMA_TEST_MOCK_RESEND: '1'
        run: node scripts/disposable_supabase.mjs start
      - name: Install Chromium browser for Playwright
        run: npx playwright install --with-deps chromium
      - name: Build and serve isolated frontend
        run: |
          eval "$(node scripts/disposable_supabase.mjs env | sed 's/^/export /')"
          export VITE_SUPABASE_URL="$MMA_TEST_API_BASE"
          export VITE_SUPABASE_ANON_KEY='sb_publishable_ACJWlzQHlZjBrEguHvfOxg_3BJgxAaH'
          export VITE_STRIPE_PRICE_FULL_SUPPORT_MONTHLY='price_test'
          npm run build
          MMA_PROVIDER_SESSION_TEST=1 npx vite preview --host 127.0.0.1 --port 5280 --strictPort > /tmp/hcn_vite.log 2>&1 &
          echo $! > /tmp/hcn_vite.pid
          npx wait-on http://127.0.0.1:5280
      - name: Run Clinical Coordination browser acceptance (fictional data)
        run: |
          eval "$(node scripts/disposable_supabase.mjs env | sed 's/^/export /')"
          export MMA_E2E_FRONTEND_BASE=http://127.0.0.1:5280
          export MMA_E2E_API_BASE="$MMA_TEST_API_BASE"
          export MMA_E2E_DB_CONTAINER="$MMA_TEST_DB_CONTAINER"
          npx playwright test --project=chromium \
            tests/e2e_hcn_coordination_plan_ui.spec.ts \
            tests/e2e_hcn_director_clinical_coordination.spec.ts \
            tests/e2e_hcn_caregiver_clinical_role_views.spec.ts \
            tests/e2e_hcn_external_provider_access.spec.ts \
            tests/e2e_hcn_director_workspace_reorg.spec.ts \
            tests/e2e_hcn_master28_provider_messaging.spec.ts \
            tests/e2e_hcn_master28_office_owner_approval.spec.ts \
            tests/e2e_hcn_master28_owner_office_approval.spec.ts
      - name: Tear down isolated browser test systems
        if: always()
        run: |
          kill "$(cat /tmp/hcn_vite.pid)" 2>/dev/null || true
          node scripts/disposable_supabase.mjs stop
          kill "$(cat /tmp/hcn_mock_resend.pid)" 2>/dev/null || true
      - uses: actions/upload-artifact@v4
        if: ${{ !cancelled() }}
        with:
          name: clinical-playwright-report
          path: playwright-report/
          if-no-files-found: ignore
          retention-days: 14
