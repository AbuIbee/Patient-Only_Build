name: Web Build
on:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install
      - run: npm run appflow:build
      - uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "chore: web build assets"
